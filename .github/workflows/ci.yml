name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the project claims to support, so it is
        # tested rather than assumed.
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q --junit-xml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint
        run: flake8 proxy_server dashboard tests benchmarks

  compose-config:
    # Catches a malformed compose file without needing a daemon.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker compose
        run: docker compose config --quiet

      - name: Validate Grafana dashboard JSON
        run: python -c "import json; json.load(open('grafana/proxy-dashboard.json'))"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: proxy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run -d --name proxy-ci -p 8080:8080 -p 8081:8081 proxy:ci \
            --host 0.0.0.0 --port 8080 --no-cache --metrics-port 0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/ready >/dev/null 2>&1; then
              echo "proxy is ready"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8081/health
          curl -fsS -x http://127.0.0.1:8080 http://example.com/ -o /dev/null -w 'proxied status: %{http_code}\n'
          docker rm -f proxy-ci
