# Full stack: nginx -> 3 proxy instances -> upstream, with Redis for the
# shared cache and Prometheus/Grafana for observability.
#
# nginx load balances at layer 4 (the stream module), not layer 7. A
# forward proxy speaks absolute-form request lines and CONNECT, which an
# HTTP reverse proxy would try to interpret and rewrite. TCP pass-through
# is the only correct choice here.

name: http-proxy-stack

x-proxy-common: &proxy-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  environment:
    PYTHONUNBUFFERED: "1"
  networks: [proxynet]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/ready', timeout=2).status==200 else 1)"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s
  # Give in-flight requests a chance to finish. The server reports
  # not-ready first, so nginx stops sending new work during this window.
  stop_grace_period: 20s

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    networks: [proxynet]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  proxy1:
    <<: *proxy-common
    container_name: proxy1
    command: ["--host", "0.0.0.0", "--port", "8080", "--metrics-port", "9100", "--redis-url", "redis://redis:6379/0", "--metrics", "/app/logs/metrics.csv", "--access-log", "/app/logs/access.log", "--error-log", "/app/logs/error.log"]

  proxy2:
    <<: *proxy-common
    container_name: proxy2
    command: ["--host", "0.0.0.0", "--port", "8080", "--metrics-port", "9100", "--redis-url", "redis://redis:6379/0", "--metrics", "/app/logs/metrics.csv", "--access-log", "/app/logs/access.log", "--error-log", "/app/logs/error.log"]

  proxy3:
    <<: *proxy-common
    container_name: proxy3
    command: ["--host", "0.0.0.0", "--port", "8080", "--metrics-port", "9100", "--redis-url", "redis://redis:6379/0", "--metrics", "/app/logs/metrics.csv", "--access-log", "/app/logs/access.log", "--error-log", "/app/logs/error.log"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [proxynet]
    depends_on:
      proxy1:
        condition: service_healthy
      proxy2:
        condition: service_healthy
      proxy3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [proxynet]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Local-only stack. Do not reuse these settings anywhere reachable.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/proxy-dashboard.json:/var/lib/grafana/dashboards/proxy-dashboard.json:ro
      - grafana-data:/var/lib/grafana
    networks: [proxynet]
    depends_on: [prometheus]

  # Opt-in origin that returns a cacheable response, used by
  # scripts/verify_stack.sh to prove the Redis cache is shared across
  # instances. Not started by a plain `docker compose up`.
  cache-origin:
    image: python:3.11-slim
    profiles: ["verify"]
    restart: unless-stopped
    networks: [proxynet]
    command:
      - python
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        import itertools
        counter = itertools.count(1)

        class Handler(BaseHTTPRequestHandler):
            protocol_version = "HTTP/1.1"

            def do_GET(self):
                body = ("origin-served-%d" % next(counter)).encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.send_header("Content-Length", str(len(body)))
                self.send_header("Cache-Control", "max-age=300")
                self.end_headers()
                self.wfile.write(body)

            def log_message(self, *args):
                pass

        ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()

networks:
  proxynet:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
