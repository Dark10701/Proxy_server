worker_processes auto;

events {
    worker_connections 4096;
}

# Layer 4 load balancing. A forward proxy receives absolute-form request
# lines ("GET http://host/path HTTP/1.1") and CONNECT, neither of which
# survives an HTTP reverse proxy that wants to rewrite and re-target
# them. TCP pass-through hands the bytes through untouched.
stream {
    log_format proxy_stream '$remote_addr [$time_local] $protocol $status '
                            '$bytes_sent $bytes_received $session_time '
                            '-> $upstream_addr';
    access_log /var/log/nginx/stream-access.log proxy_stream;
    error_log  /var/log/nginx/stream-error.log warn;

    upstream proxy_pool {
        # Least connections rather than round robin: CONNECT tunnels are
        # long-lived, so counting sessions reflects real load far better
        # than counting how many were handed out.
        least_conn;

        # Passive health checking, which is what nginx OSS offers. Three
        # failures inside 15s takes an instance out of rotation for 15s,
        # so a restarting container stops receiving traffic rather than
        # black-holing it. Combined with the container reporting
        # not-ready during shutdown, a rolling restart drains cleanly.
        server proxy1:8080 max_fails=3 fail_timeout=15s;
        server proxy2:8080 max_fails=3 fail_timeout=15s;
        server proxy3:8080 max_fails=3 fail_timeout=15s;
    }

    server {
        listen 8080;

        proxy_pass proxy_pool;

        # Try the next backend if one is down or refuses mid-connect.
        proxy_next_upstream on;
        proxy_connect_timeout 5s;

        # Generous, because CONNECT tunnels legitimately idle. This must
        # exceed the proxy's own tunnel idle timeout (300s) so nginx is
        # not the component that severs a healthy tunnel.
        proxy_timeout 330s;
    }
}
