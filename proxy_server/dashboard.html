<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proxy Monitoring Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f7fb; }
        h1 { margin-top: 0; }
        .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
        .card { background: white; border-radius: 8px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .card h3 { margin: 0; font-size: 14px; color: #666; }
        .card p { margin: 8px 0 0; font-size: 22px; font-weight: bold; }
        .charts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .chart-box { background: white; border-radius: 8px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        th, td { border-bottom: 1px solid #eee; padding: 8px; text-align: left; font-size: 13px; }
        th { background: #fafafa; }
        tr.blocked { background: #ffe6e6; }
    </style>
</head>
<body>
    <h1>Proxy Monitoring Dashboard</h1>

    <div class="cards">
        <div class="card"><h3>Total Requests</h3><p id="totalRequests">0</p></div>
        <div class="card"><h3>Active Connections</h3><p id="activeConnections">0</p></div>
        <div class="card"><h3>Avg Latency (ms)</h3><p id="avgLatency">0</p></div>
        <div class="card"><h3>Total Bandwidth (bytes)</h3><p id="totalBandwidth">0</p></div>
    </div>

    <div class="charts">
        <div class="chart-box"><canvas id="requestsChart"></canvas></div>
        <div class="chart-box"><canvas id="latencyChart"></canvas></div>
        <div class="chart-box"><canvas id="blockedChart"></canvas></div>
        <div class="chart-box"><canvas id="domainsChart"></canvas></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Timestamp</th><th>Client IP</th><th>Method</th><th>Host</th><th>Status</th>
                <th>Latency (ms)</th><th>Sent</th><th>Received</th><th>Blocked</th>
            </tr>
        </thead>
        <tbody id="recentTableBody"></tbody>
    </table>

    <script>
        const requestsChart = new Chart(document.getElementById('requestsChart'), {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Requests / minute', data: [], borderColor: '#1976d2' }] },
            options: { responsive: true }
        });

        const latencyChart = new Chart(document.getElementById('latencyChart'), {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Average latency (ms)', data: [], borderColor: '#ef6c00' }] },
            options: { responsive: true }
        });

        const blockedChart = new Chart(document.getElementById('blockedChart'), {
            type: 'pie',
            data: {
                labels: ['Allowed', 'Blocked'],
                datasets: [{ data: [0, 0], backgroundColor: ['#43a047', '#e53935'] }]
            },
            options: { responsive: true }
        });

        const domainsChart = new Chart(document.getElementById('domainsChart'), {
            type: 'bar',
            data: { labels: [], datasets: [{ label: 'Top domains', data: [], backgroundColor: '#6a1b9a' }] },
            options: { responsive: true }
        });

        async function refresh() {
            const [summary, series, domains, recent] = await Promise.all([
                fetch('/api/summary').then(r => r.json()),
                fetch('/api/time-series').then(r => r.json()),
                fetch('/api/top-domains').then(r => r.json()),
                fetch('/api/recent-requests').then(r => r.json())
            ]);

            document.getElementById('totalRequests').textContent = summary.total_requests;
            document.getElementById('activeConnections').textContent = summary.active_connections;
            document.getElementById('avgLatency').textContent = summary.average_latency_ms;
            document.getElementById('totalBandwidth').textContent = summary.total_bandwidth_bytes;

            requestsChart.data.labels = series.timestamps;
            requestsChart.data.datasets[0].data = series.requests_per_minute;
            requestsChart.update();

            latencyChart.data.labels = series.timestamps;
            latencyChart.data.datasets[0].data = series.average_latency;
            latencyChart.update();

            blockedChart.data.datasets[0].data = [summary.total_requests - summary.blocked_requests, summary.blocked_requests];
            blockedChart.update();

            domainsChart.data.labels = domains.domains;
            domainsChart.data.datasets[0].data = domains.counts;
            domainsChart.update();

            const body = document.getElementById('recentTableBody');
            body.innerHTML = '';
            recent.forEach((item) => {
                const row = document.createElement('tr');
                if (item.blocked) row.className = 'blocked';
                row.innerHTML = `
                    <td>${item.timestamp}</td>
                    <td>${item.client_ip}</td>
                    <td>${item.method}</td>
                    <td>${item.host}</td>
                    <td>${item.status_code}</td>
                    <td>${item.latency_ms}</td>
                    <td>${item.bytes_sent}</td>
                    <td>${item.bytes_received}</td>
                    <td>${item.blocked}</td>
                `;
                body.appendChild(row);
            });
        }

        refresh();
        setInterval(refresh, 2000);
    </script>
</body>
</html>
