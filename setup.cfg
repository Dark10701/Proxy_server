[flake8]
max-line-length = 100
extend-ignore =
    # Bare-ish except in cleanup paths is deliberate and commented.
    E722,
    # Line-break before binary operator; conflicts with modern style.
    W503
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    benchmarks/_out,
    benchmarks/_logs
per-file-ignores =
    # main.py and dashboard/app.py bootstrap sys.path before importing.
    proxy_server/main.py:E402
    dashboard/app.py:E402
    benchmarks/run_bench.py:E402
